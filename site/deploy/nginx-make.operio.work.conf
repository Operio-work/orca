# make.operio.work — static ORCA site on box1.
# Install: /etc/nginx/sites-available/make.operio.work, symlinked into sites-enabled.
# Needs the certificate first (see DEPLOY.md: certbot with the Cloudflare DNS challenge).
#
# URL scheme: every page is a prerendered file <path>.html (catalog.html, es/catalog.html).
# try_files looks for the exact file, then <path>.html, so a directory is never served and
# nginx never redirects /es to /es/. A trailing slash gets exactly one 301 to the bare path.

server {
    listen 80;
    listen [::]:80;
    server_name make.operio.work;
    return 301 https://make.operio.work$request_uri;
}

server {
    # "http2" on listen works on Ubuntu's nginx 1.24; on nginx >= 1.25.1 it only warns
    # (there, "http2 on;" is the newer spelling).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name make.operio.work;

    ssl_certificate     /etc/letsencrypt/live/make.operio.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/make.operio.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:make_operio:10m;

    root  /var/www/make.operio.work;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;   # redirects keep the visitor's scheme and host

    access_log /var/log/nginx/make.operio.work.access.log;
    error_log  /var/log/nginx/make.operio.work.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Security headers. nginx drops server-level add_header in any location that has its own
    # add_header, so each location repeats the ones it needs.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";

    # One canonical form: no trailing slash (except the root).
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;

    # The home page (try_files never applies "index", so name the file).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Every other page: the exact file, then <path>.html. Directories are never tried.
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed build output never changes: cache for a year.
    location /_app/immutable/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Fonts, screenshots and icons: not hashed, so a week, then revalidate.
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Demo videos (/media/*.mp4): static files, so nginx answers Range requests itself
    # (206 + Accept-Ranges: bytes) for seeking and iOS playback; video/mp4 comes from
    # mime.types. Already compressed (gzip_types leaves video alone). Not hashed: a week,
    # then revalidate by ETag/Last-Modified. The page sets preload="none", so nothing is
    # fetched until a visitor presses play.
    location ~* \.mp4$ {
        try_files $uri =404;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Captions for the videos. Older mime.types files lack vtt, so name the type here.
    location ~* \.vtt$ {
        types { }
        default_type text/vtt;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The installer: always plain text (curl | bash, and readable in a browser), never stale.
    location = /install.sh {
        types { }
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Panel release tarballs + checksums. A version is never rebuilt, so cache hard.
    location ^~ /releases/ {
        types { application/gzip gz; text/plain sha256; }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /robots.txt  { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /sitemap.xml { try_files $uri =404; add_header Cache-Control "no-cache" always; }

    # Hidden files are never served.
    location ~ /\. { deny all; }
}
