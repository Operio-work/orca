# cargo-about config for herdr's Rust dependencies (used by scripts/notices.js).
# Only licenses below are accepted; anything else makes cargo-about fail, which is the point.
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "0BSD", "Unlicense", "BSL-1.0", "Unicode-DFS-2016", "Unicode-3.0",
]
# The four platforms the installer supports.
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin",
]
# Only what ends up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
